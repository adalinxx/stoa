name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client-and-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test client/*.test.mjs app/test-app.mjs

  # The page in headless Chromium against a private Lattice stack. Runs inside
  # the node image, which carries the lattice binaries; bump the pin to test
  # against a newer node.
  ui:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/adalinxx/lattice-node:sha-5044b3d@sha256:4c4d6602ffd9e0282146fdddd839584c7f198a1163fadbaa9956e9fffba66ca8
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Lattice Wallet the page connects to, at a pinned commit.
      - uses: actions/checkout@v4
        with:
          repository: adalinxx/lattice-wallet
          ref: 0794c97bffd59554de3bf45d5249d309b0fbd988
          path: lattice-wallet
          submodules: recursive
      - name: Build the Lattice Wallet
        working-directory: lattice-wallet
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Playwright's Chromium
        working-directory: e2e/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: UI tests
        working-directory: e2e/ui
        env:
          LATTICE: /usr/local/bin/lattice
          LATTICE_SDK: ${{ github.workspace }}/app/vendor/lattice-sdk.js
          LATTICE_WALLET: ${{ github.workspace }}/lattice-wallet/dist
        run: npm test
