name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The other repositories the UI tests run against, pinned to commits the suite
# passes on. Move a pin on purpose, in its own commit, after running the suite.
env:
  NODE_VERSION: "22"
  LATTICE_NODE_REPO: 0xLattice/lattice-node
  LATTICE_NODE_REF: 9abd15b1bb05a0d4305e83f64c4676a6e296071f # the node lattice-sponsor builds on
  LATTICE_SPONSOR_REPO: 0xLattice/lattice-sponsor
  LATTICE_SPONSOR_REF: 24d8c4def3bd47c45b4cd10115762894e5185ea5 # keeps files for work (--sell-storage)
  LATTICE_WALLET_REPO: adalinxx/selfhold-wallet
  LATTICE_WALLET_REF: e46b9ef8e132196e704b8ec37a10a52a7710d1fd # @selfhold/web, as app/vendor/selfhold.mjs (selfhold-wallet#47)

jobs:
  client-and-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test client/*.test.mjs app/test-app.mjs

  node:
    name: Build the Lattice node and sponsor
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    timeout-minutes: 90
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: bin
          key: lattice-node-${{ env.LATTICE_NODE_REF }}-sponsor-${{ env.LATTICE_SPONSOR_REF }}-static-1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LATTICE_NODE_REPO }}
          ref: ${{ env.LATTICE_NODE_REF }}
          path: lattice-node
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LATTICE_SPONSOR_REPO }}
          ref: ${{ env.LATTICE_SPONSOR_REF }}
          path: lattice-sponsor
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build
        shell: bash
        run: |
          apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
          cd lattice-node
          # Static Swift runtime, so the binaries run on a plain runner. The
          # lattice command runs the node, the miner and its coordinator from
          # beside it; the UI tests run lattice-sponsor from there too.
          swift build --static-swift-stdlib
          mkdir ../bin
          cp "$(swift build --static-swift-stdlib --show-bin-path)"/{lattice,lattice-node,lattice-miner,lattice-mining-coordinator} ../bin/
          cd ../lattice-sponsor
          swift build --static-swift-stdlib --product lattice-sponsor
          cp "$(swift build --static-swift-stdlib --show-bin-path)"/lattice-sponsor ../bin/
      - uses: actions/upload-artifact@v4
        with:
          name: lattice
          path: bin
          retention-days: 3

  # The page in headless Chromium against a private Lattice stack, with
  # Selfhold's window as its wallet and a sponsor for fees and files.
  ui:
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LATTICE: ${{ github.workspace }}/.deps/bin/lattice
      LATTICE_SDK: ${{ github.workspace }}/app/vendor/lattice-sdk.js
      LATTICE_WALLET_WEB: ${{ github.workspace }}/.deps/selfhold-wallet/dist-web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: lattice
          path: .deps/bin
      # The node links the Swift runtime in, but not these.
      - run: chmod +x .deps/bin/* && sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-0 libcurl4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LATTICE_WALLET_REPO }}
          ref: ${{ env.LATTICE_WALLET_REF }}
          path: .deps/selfhold-wallet
          submodules: true
      - name: Build Selfhold's window
        working-directory: .deps/selfhold-wallet
        run: npm ci && npm run build:web
      - name: The page's selfhold.mjs is the pinned one's
        run: tail -n +3 app/vendor/selfhold.mjs | cmp - .deps/selfhold-wallet/dist-web/v1/selfhold.js
      - name: Install Playwright
        working-directory: e2e/ui
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: UI tests
        working-directory: e2e/ui
        run: npm test
        env:
          SHOTS: ${{ github.workspace }}/e2e/ui/shots
      # Each step as a person sees it, Selfhold's window included, for review.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: e2e/ui/shots
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        name: The node's and the sponsor's logs
        run: |
          find "${RUNNER_TEMP:-/tmp}" /tmp -path '*stoa-ui-*' -name '*.log' -type f 2>/dev/null | sort -u |
            while IFS= read -r f; do
              echo "::group::$f"; tail -n 200 "$f" || true; echo "::endgroup::"
            done
